# E1: L7 water-fill shedding. Tenants simulated via PROXY protocol; severity driven by the
# injected_resource monitor through the shed_tenant_load scaled trigger (0.80 -> 0.90).
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.injected_resource
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.injected_resource.v3.InjectedResourceConfig
      filename: /tmp/ip_load_shed_exp/pressure
  actions:
  - name: envoy.overload_actions.shed_tenant_load
    triggers:
    - name: envoy.resource_monitors.injected_resource
      scaled:
        scaling_threshold: 0.80
        saturation_threshold: 0.90

static_resources:
  listeners:
  - name: l7_ingress
    address:
      socket_address: { address: 127.0.0.1, port_value: 10000 }
    per_connection_buffer_limit_bytes: 262144
    listener_filters:
    - name: envoy.filters.listener.proxy_protocol
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          http_filters:
          - name: envoy.filters.http.ip_load_shed
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ip_load_shed.v3.IpLoadShed
              water_fill:
                overload_action_name: envoy.overload_actions.shed_tenant_load
                evaluation_interval: 0.1s
                tenant_key_source: REMOTE_ADDRESS
              stream_cost_bytes: 65536
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: slow_upstream, timeout: 60s }
  clusters:
  - name: slow_upstream
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: slow_upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8080 }
