# E2: L4 water-fill shedding. Same tenant simulation and pressure drive as l7.yaml, but a raw
# TCP listener: proxy_protocol -> tenant_load_shed (network) -> tcp_proxy -> slow sink.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.injected_resource
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.injected_resource.v3.InjectedResourceConfig
      filename: /tmp/tenant_load_shed_exp/pressure
  actions:
  - name: envoy.overload_actions.shed_tenant_load
    triggers:
    - name: envoy.resource_monitors.injected_resource
      scaled:
        scaling_threshold: 0.80
        saturation_threshold: 0.90

static_resources:
  listeners:
  - name: l4_ingress
    address:
      socket_address: { address: 127.0.0.1, port_value: 10001 }
    per_connection_buffer_limit_bytes: 262144
    listener_filters:
    - name: envoy.filters.listener.proxy_protocol
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
    filter_chains:
    - filters:
      - name: envoy.filters.network.tenant_load_shed
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tenant_load_shed.v3.TenantLoadShed
          water_fill:
            overload_action_name: envoy.overload_actions.shed_tenant_load
            evaluation_interval: 0.1s
            tenant_key_source: REMOTE_ADDRESS
          connection_cost_bytes: 32768
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: l4_egress
          cluster: slow_sink
  clusters:
  - name: slow_sink
    connect_timeout: 1s
    type: STATIC
    per_connection_buffer_limit_bytes: 262144
    load_assignment:
      cluster_name: slow_sink
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8081 }
