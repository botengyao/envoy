# Gemini on Vertex AI clients, served by Claude on Vertex AI in the project and region they call.
#
# The route declares the client's API, the backend's, and the backend's binding: Claude on Vertex
# AI names the model and the method in the path. The transcoder converts the request and renders
# that path from what the client's path held; the dynamic forward proxy sends it to the regional
# endpoint the client addressed.
#
# Three settings serve the local run against mock_vertex.py, and are marked "Local run": the DNS
# resolver, the `:8443` port, and the trusted CA. Against Vertex AI itself, drop the resolver and
# the port, trust the system CA bundle, and let the gcp_authn filter supply the access token.

admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 9980}

static_resources:
  listeners:
  - name: gateway
    address:
      socket_address: {address: 127.0.0.1, port_value: 10080}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  status: "%RESPONSE_CODE%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  client_model: "%FILTER_STATE(envoy.ai.binding.read:FIELD:model)%"
                  project: "%FILTER_STATE(envoy.ai.binding.read:FIELD:project)%"
                  location: "%FILTER_STATE(envoy.ai.binding.read:FIELD:location)%"
                  backend_model: "%FILTER_STATE(envoy.ai.model.resolved:PLAIN)%"
                  upstream: "%REQ(:AUTHORITY)%%REQ(:PATH)%"
                  upstream_address: "%UPSTREAM_HOST%"
                  duration_ms: "%DURATION%"
          route_config:
            name: vertex
            virtual_hosts:
            - name: vertex
              domains: ["*"]
              routes:
              # Gemini on Vertex AI's generateContent and streamGenerateContent.
              - match:
                  safe_regex:
                    regex: ".*/publishers/google/models/[^/]+:(generate|streamGenerate)Content"
                route:
                  cluster: vertex
                  timeout: 300s
                request_headers_to_add:
                # The gcp_authn filter supplies a real access token.
                - header: {key: authorization, value: "Bearer test-access-token"}
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                request_headers_to_remove:
                - x-vertex-host
                # The transcoder rewrites the response, so it asks for one it can read.
                - accept-encoding
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request:
                      llm_protocol: GEMINI_GENERATE_CONTENT
                    response:
                      llm_protocol: ANTHROPIC_MESSAGES
                      # Claude on Vertex AI: the model and the method in the path, and the
                      # Vertex AI API version in the body.
                      binding:
                        uri_pattern: "/{version}/projects/{project}/locations/{location}/publishers/anthropic/models/{model}:{rawPredict|streamRawPredict}"
                        mutations:
                        - body_field: model
                        - body_field: anthropic_version
                          value: vertex-2023-10-16
                          keep_existing: true
                  ai_instructions:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                    on_request_headers:
                    # The Claude model that answers in place of the Gemini one the client names.
                    - object_key: envoy.ai.model.resolved
                      format_string:
                        text_format_source: {inline_string: "claude-sonnet-4-5@20250929"}
                  envoy.filters.http.dynamic_forward_proxy:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.PerRouteConfig
                    host_rewrite_header: x-vertex-host
          http_filters:
          # Per-route values only; see the route's `ai_instructions`.
          - name: ai_instructions
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              # Client side: Gemini to the common form on the way in, and back on the way out.
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: TO_IR
                  response_handling: FROM_IR
              # Backend side: the common form to Claude, rendered under the route's binding.
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: FROM_IR
                  response_handling: TO_IR
          # The regional endpoint, from the location the transcoder read from the client's path.
          - name: vertex_host
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - append:
                    header:
                      key: x-vertex-host
                      # Local run: `:8443`, where mock_vertex.py listens.
                      value: "%FILTER_STATE(envoy.ai.binding.read:FIELD:location)%-aiplatform.googleapis.com:8443"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &vertex_dns
                name: vertex
                dns_lookup_family: V4_ONLY
                # Local run: mock_vertex.py answers for *-aiplatform.googleapis.com.
                typed_dns_resolver_config:
                  name: envoy.network.dns_resolver.cares
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
                    resolvers:
                    - socket_address: {address: 127.0.0.1, port_value: 15353}
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: vertex
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *vertex_dns
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        # TLS names and checks the regional host the request goes to.
        upstream_http_protocol_options:
          auto_sni: true
          auto_san_validation: true
        auto_config:
          http2_protocol_options: {}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            # Local run: the CA gen_certs.sh made for mock_vertex.py.
            trusted_ca: {filename: certs/ca.pem}
