syntax = "proto3";

package envoy.extensions.filters.http.ai_protocol_manager.v3;

import "envoy/config/core/v3/extension.proto";
import "envoy/type/ai/v3/llm_protocol.proto";

import "google/protobuf/wrappers.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.ai_protocol_manager.v3";
option java_outer_classname = "AiProtocolManagerProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/ai_protocol_manager/v3;ai_protocol_managerv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: AI Protocol Manager]
// AI Protocol Manager filter
// :ref:`configuration overview <config_http_filters_ai_protocol_manager>`.
// [#extension: envoy.filters.http.ai_protocol_manager]

// Configuration for the AI Protocol Manager filter.
//
// The filter manages AI endpoint traffic on both directions of a stream. On
// the request path it holds a declared AI endpoint's payload and parses it,
// which is what lets routing, admission and policy act on a payload the proxy
// understands rather than on opaque bytes. On the response path it runs the
// same AI filters over the response, for example to publish the token usage it
// reports with the :ref:`token usage AI filter
// <envoy_v3_api_msg_extensions.http.ai_filters.token_usage.v3.TokenUsage>`.
//
// Processing is enabled by the presence of ``request_handling``. Which routes
// are AI endpoints — and which :ref:`wire API <envoy_v3_api_enum_type.ai.v3.LLMProtocol>`
// each speaks — is declared with the :ref:`per-route configuration
// <envoy_v3_api_msg_extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute>`.
message AiProtocolManager {
  reserved 2;

  reserved "response_handling";

  // Request-side AI protocol processing. When unset, the decode path is a
  // pure passthrough — including on routes carrying per-route configuration.
  RequestHandling request_handling = 1;

  // AI filters, in order. They run over a declared AI endpoint's parsed request payload
  // before it continues down the HTTP filter chain, and require ``request_handling``.
  // [#extension-category: envoy.http.ai_filters]
  repeated config.core.v3.TypedExtensionConfig filters = 3;
}

// Request-side processing configuration. A route that carries a
// :ref:`per-route request declaration
// <envoy_v3_api_field_extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute.request>`
// has its payload held, offloaded, and parsed strictly: a body that is not
// well-formed JSON is rejected with a 400 rather than forwarded for the
// upstream to interpret differently.
message RequestHandling {
  // How the request body is written out once the :ref:`AI filters
  // <envoy_v3_api_field_extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager.filters>`
  // finish.
  enum BodyReserialization {
    // Re-serialize the parsed document, so the edits AI filters make to it reach the upstream.
    ALWAYS = 0;

    // Forward the received body byte for byte. Edits AI filters make to the parsed document are
    // not sent, so use this only with AI filters that read the request, such as request info.
    DISABLE = 1;
  }

  // Attempt best-effort JSON parsing on routes without a per-route
  // configuration.
  //
  // Defaults to ``false``: unconfigured routes are not buffered or parsed.
  // When ``true``, such routes are parsed too, but never failed over it — a
  // route that declared no AI wire contract has nothing to hold its payload
  // to, so a body that fails to parse is forwarded unchanged.
  //
  // Only requests that can be held to end of stream are taken: the request must
  // carry a JSON content type (``application/json`` or a ``+json`` suffix) and
  // must not be gRPC or Connect streaming, an upgrade, or a CONNECT. Holding a
  // full-duplex request would stall it, since the client may not finish the
  // request until it sees a response the held upstream cannot produce.
  bool parse_unconfigured_routes = 1;

  // Request-path parsing limits. Defaults apply when unset.
  RequestParsingLimits limits = 2;

  // Whether the parsed request is re-serialized once the AI filters finish. Defaults to ``ALWAYS``.
  // Requests that run no AI filters are forwarded as received either way.
  BodyReserialization reserialize_body = 3 [(validate.rules).enum = {defined_only: true}];
}

// Per-stream limits for request payload parsing.
message RequestParsingLimits {
  // Maximum size, in bytes, of a decoded string value kept inline in the
  // parsed document; a larger value stays in the external buffer and is
  // referenced by offset. Object keys are always inline.
  //
  // This is the deployment-wide default, applied when a declared API's payload
  // schema does not pin its own threshold. Defaults to 1KiB, which keeps
  // ordinary metadata (model names, roles, tool names) inline while
  // conversation content goes to the buffer.
  //
  // Keep it above the longest ``model`` name in use. Values over the threshold
  // are offloaded, and the :ref:`schema validation AI filter
  // <envoy_v3_api_msg_extensions.http.ai_filters.schema_validation.v3.SchemaValidation>`
  // requires ``model`` inline, so it rejects an offloaded one with a 400.
  google.protobuf.UInt32Value inline_string_threshold_bytes = 1
      [(validate.rules).uint32 = {lte: 1048576 gte: 64}];
}

// Per-route configuration. Its presence declares the route an AI endpoint.
//
// Request and response wire protocols are declared separately because
// protocol translation can make the client-facing request API differ from
// the provider's response API: the :ref:`transcoder AI filter
// <envoy_v3_api_msg_extensions.http.ai_filters.transcoder.v3.Transcoder>`
// converts between the two.
message AiProtocolManagerPerRoute {
  // Request-side route configuration. Its presence hands the request payload
  // to the filter to hold and validate (when :ref:`request_handling
  // <envoy_v3_api_field_extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager.request_handling>`
  // is enabled).
  RequestPerRoute request = 1;

  // Optional response-side route configuration: the wire API of the backend
  // the route sends the request to.
  ResponsePerRoute response = 2;
}

// Per-route request-side behavior.
message RequestPerRoute {
  // The wire API a request payload on this route follows.
  // ``LLM_PROTOCOL_UNSPECIFIED`` declares the endpoint without naming its
  // API. The ``envoy.ai.llm_protocol.request`` filter state object, when it
  // names one, takes precedence.
  //
  // The :ref:`schema validation AI filter
  // <envoy_v3_api_msg_extensions.http.ai_filters.schema_validation.v3.SchemaValidation>`
  // holds a payload to its API's schema.
  //
  // [#comment: Normalization is not implemented yet; a normalization knob
  // will be added here once the transformation and its output contract
  // exist.]
  type.ai.v3.LLMProtocol llm_protocol = 1 [(validate.rules).enum = {defined_only: true}];
}

// Per-route response-side behavior.
message ResponsePerRoute {
  // The wire API the response on this route follows. This can differ from
  // ``request.llm_protocol`` when the gateway performs protocol translation.
  type.ai.v3.LLMProtocol llm_protocol = 1 [(validate.rules).enum = {defined_only: true}];
}
