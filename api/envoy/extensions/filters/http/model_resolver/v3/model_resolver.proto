syntax = "proto3";

package envoy.extensions.filters.http.model_resolver.v3;

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.model_resolver.v3";
option java_outer_classname = "ModelResolverProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/model_resolver/v3;model_resolverv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Model resolver]
// Model resolver :ref:`configuration overview <config_http_filters_model_resolver>`.
// [#extension: envoy.filters.http.model_resolver]

message ModelResolver {
  // Dynamic metadata namespace holding the request's
  // :ref:`ModelRoutingPolicy <envoy_v3_api_msg_data.ai.v3.ModelRoutingPolicy>`, either as typed
  // metadata or as a ``Struct`` in the policy's JSON form. Defaults to ``envoy.ai.model_routing``.
  // The policy names the hosts that requests connect to, so only trusted filters may write this
  // namespace.
  string policy_metadata_namespace = 1;

  // If true, a request without a usable policy, or with a body other than uncompressed JSON,
  // continues without a plan. By default it gets a 503 response, because on a dynamic forward proxy
  // route a request without a plan goes to the host the client names.
  bool continue_without_policy = 2;

  // If true, and an :ref:`AI protocol manager <config_http_filters_ai_protocol_manager>` filter
  // earlier in the chain parsed the request body, the plan follows the models the request asks
  // for. The request's ``models`` list, or else its ``model``, selects the policy targets whose
  // ``model`` matches, in the order the request lists them, and the policy order breaks ties. When
  // no target matches, the policy is used as it is.
  bool prefer_request_models = 3;
}
