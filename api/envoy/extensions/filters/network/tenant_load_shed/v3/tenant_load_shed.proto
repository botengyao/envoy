syntax = "proto3";

package envoy.extensions.filters.network.tenant_load_shed.v3;

import "envoy/extensions/filters/common/tenant_load_shed/v3/water_fill.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.network.tenant_load_shed.v3";
option java_outer_classname = "TenantLoadShedProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/network/tenant_load_shed/v3;tenant_load_shedv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Tenant-based water-fill load shedding (L4)]
// Tenant-based water-fill load shedding network filter.
// [#extension: envoy.filters.network.tenant_load_shed]

// L4 companion of the HTTP tenant_load_shed filter, sharing the same process-wide water-fill
// controller: new connections from tenants above the water level are closed at accept, and
// each connection's usage (fixed cost plus bytes seen in both directions) is charged to its
// source-IP tenant. Use this on TCP listeners (e.g. an ambient node proxy) and for tenants
// that hold connections without issuing requests, which an HTTP filter can never see.
message TenantLoadShed {
  // Shared water-fill controller configuration. Must match the HTTP filter's config when
  // both are deployed (the first instantiated filter wins).
  common.tenant_load_shed.v3.WaterFillConfig water_fill = 1
      [(validate.rules).message = {required: true}];

  // Fixed cost added to a tenant's usage for each active connection, approximating
  // per-connection socket and transport buffer overhead. Defaults to 32768 (32 KiB).
  uint64 connection_cost_bytes = 2;
}
