syntax = "proto3";

package envoy.extensions.filters.common.tenant_load_shed.v3;

import "envoy/type/v3/percent.proto";

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.common.tenant_load_shed.v3";
option java_outer_classname = "WaterFillProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/common/tenant_load_shed/v3;tenant_load_shedv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Water-fill tenant load shedding (shared controller config)]

// Configuration of the process-wide water-fill controller shared by the HTTP
// (``envoy.filters.http.tenant_load_shed``) and network (``envoy.filters.network.tenant_load_shed``)
// filters. All filter instances share one controller singleton; the first instantiated
// filter's config wins, so configure identical values on every filter instance.
// [#next-free-field: 8]
message WaterFillConfig {
  // Which downstream address identifies the tenant.
  enum TenantKeySource {
    // The direct remote address: the physical peer of the connection. Cannot be spoofed by
    // the client. This is the right choice when tenants (e.g. micro-VMs) connect directly.
    DIRECT_REMOTE_ADDRESS = 0;

    // The logical remote address, which listener filters such as the PROXY protocol filter
    // may have restored. Use only when every restoring hop is trusted, otherwise tenants can
    // shift usage onto each other.
    REMOTE_ADDRESS = 1;
  }

  // Name of an overload action (e.g. ``envoy.overload_actions.shed_tenant_load``) whose
  // trigger state provides the shed severity in [0, 1]. Configure the action with a
  // ``scaled`` trigger (e.g. scaling threshold 0.8, saturation threshold 0.9 on
  // ``envoy.resource_monitors.fixed_heap``) so severity ramps linearly with memory pressure.
  // When set, the overload manager is the pressure source and ``max_heap_size_bytes``,
  // ``shed_start_threshold`` and ``reject_all_threshold`` are only used as a fallback if the
  // action is not configured in the overload manager.
  string overload_action_name = 1;

  // Self-contained pressure mode: maximum heap size used as the pressure denominator, i.e.
  // pressure = currently_allocated_bytes / max_heap_size_bytes. Required when
  // ``overload_action_name`` is not set. This should match the overload manager's
  // ``fixed_heap`` monitor configuration.
  uint64 max_heap_size_bytes = 2;

  // Memory pressure at which water-fill shedding starts. Only used in self-contained
  // pressure mode. Defaults to 80%.
  type.v3.Percent shed_start_threshold = 3;

  // Memory pressure at or above which all new streams and connections are rejected. Only
  // used in self-contained pressure mode. Defaults to 90%.
  type.v3.Percent reject_all_threshold = 4;

  // How often per-tenant usage is aggregated and the water level is re-evaluated and
  // republished to the worker threads. Defaults to 100ms.
  google.protobuf.Duration evaluation_interval = 5;

  // Upper bound on the number of tracked tenants, so the tracker itself has bounded memory.
  // Beyond this limit, new tenants are aggregated into per-shard overflow buckets that count
  // toward total usage but are not individually sheddable below the reject-all threshold.
  // Defaults to 100000.
  uint32 max_tracked_tenants = 6;

  // Which downstream address identifies the tenant. Defaults to DIRECT_REMOTE_ADDRESS.
  TenantKeySource tenant_key_source = 7 [(validate.rules).enum = {defined_only: true}];
}
