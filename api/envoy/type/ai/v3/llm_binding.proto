syntax = "proto3";

package envoy.type.ai.v3;

import "envoy/config/common/mutation_rules/v3/mutation_rules.proto";
import "envoy/config/core/v3/base.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.type.ai.v3";
option java_outer_classname = "LlmBindingProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/type/ai/v3;aiv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: LLM binding]

// How a provider carries an :ref:`LLMProtocol <envoy_v3_api_enum_type.ai.v3.LLMProtocol>` on
// HTTP, where that differs from the API's own: the request path, and edits to the request body
// and headers. The API itself -- its schemas, stream events and usage -- does not change.
//
// Claude on Vertex AI:
//
// .. code-block:: yaml
//
//   uri_pattern: "/v1/projects/my-project/locations/us-east5/publishers/anthropic/models/{model}:{rawPredict|streamRawPredict}"
//   headers_mutations:
//   - remove: anthropic-version
//   body_mutations:
//   - remove: model
//   - append:
//       record: { key: anthropic_version, value: vertex-2023-10-16 }
//       action: ADD_IF_ABSENT
//
// The Anthropic API itself, which Envoy defines as the binding of ``ANTHROPIC_MESSAGES``:
//
// .. code-block:: yaml
//
//   uri_pattern: "/v1/messages"
//   headers_mutations:
//   - append:
//       header: { key: anthropic-version, value: "2023-06-01" }
//       append_action: ADD_IF_ABSENT
//
// A binding's mutations apply on top of the API's, so the Vertex binding removes the API's
// version header, which Vertex does not take, by naming it. On the way out, the path is rendered
// from the request and the mutations are applied in order.
// On the way in, the model and streaming mode the path names are written into the body and the
// body fields and headers the mutations write are removed, so the API's own document is
// transcoded.
//
// A mutation removes its target, or appends it with ``ADD_IF_ABSENT``, which writes it only where
// it is absent, or ``OVERWRITE_IF_EXISTS_OR_ADD``, which replaces it. Those are the writes a
// binding can take back out of a request that arrives in it, so the other actions are not
// accepted, nor are ``remove_on_match``, ``raw_value``, the deprecated ``append`` and ``entry``,
// or an append without a value. In a value, ``{name}`` is replaced by a value of the request:
// ``{model}`` by the body's model, any other name by a path variable the client's path holds,
// such as ``{project}``. A value is not a :ref:`format string <config_access_log_format>`.
message LLMBinding {
  reserved 2;

  reserved "mutations";

  // The request path, as a :ref:`URI pattern
  // <config_http_filters_ai_protocol_manager_transcoder_instructions>`: a two-way map between the
  // path and the request's named values, each matching one path segment. ``{model}`` is the
  // request's model and the ``{unary|stream}`` choice its ``stream``, where the two sides differ in
  // the path; any other variable, such as ``{project}``, is a path variable, kept beside the body
  // and never in it. Coming in, the pattern reads the client's path into those values; going out,
  // it is rendered from them. Unnamed wildcards and the query are never read. When empty, the
  // API's own path is used.
  string uri_pattern = 1;

  // Ordered edits to the request headers, for a header the provider's API requires alongside the
  // body, such as Anthropic's ``anthropic-version``. Header names are lower-case, and
  // pseudo-headers (``:path`` is ``uri_pattern``'s), ``host``, ``content-length`` and
  // ``transfer-encoding`` are not accepted. Credentials do not belong here: a binding is
  // configuration, not a secret.
  repeated config.common.mutation_rules.v3.HeaderMutation headers_mutations = 3;

  // Ordered edits to top-level members of the request body. A value may be any JSON value.
  //
  // Both lists apply after the API's own edits. One that names a field or header the API's edits
  // also name replaces that edit; the API's other edits still apply. So a binding that only adds
  // a header keeps, say, Gemini's removal of ``model`` and ``stream`` from the body, and overrides
  // one of the API's edits by naming its target.
  repeated config.core.v3.KeyValueMutation body_mutations = 4;
}
