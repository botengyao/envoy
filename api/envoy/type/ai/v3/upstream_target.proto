syntax = "proto3";

package envoy.type.ai.v3;

import "envoy/type/ai/v3/endpoint.proto";
import "envoy/type/ai/v3/llm_protocol.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.type.ai.v3";
option java_outer_classname = "UpstreamTargetProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/type/ai/v3;aiv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: AI upstream target]

// The upstream a request is sent to. Only trusted, configuration-driven writers may set it; it is
// never derived from request content.
// [#next-free-field: 6]
message UpstreamTarget {
  // The protocol the upstream speaks. Unspecified means none is declared.
  LLMProtocol llm_protocol = 1 [(validate.rules).enum = {defined_only: true}];

  // The ``host[:port]`` the request goes to.
  string authority = 2;

  // Where the upstream serves ``llm_protocol``. Unset: the protocol's default.
  Endpoint endpoint = 3;

  // The model the upstream is asked for. Unset: the request's own model.
  string model = 4;

  // The name of the credential to send the request with; never the secret itself.
  string credential = 5;
}
