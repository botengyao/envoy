syntax = "proto3";

package envoy.data.ai.v3;

import "google/protobuf/duration.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.data.ai.v3";
option java_outer_classname = "ModelRoutingPolicyProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/data/ai/v3;aiv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: AI model routing policy]

// Ordered model routing decision for one request. An external policy decision point returns it,
// for example as dynamic metadata from the external processing filter, and the
// :ref:`model routing filter <config_http_filters_model_routing>` turns it into a plan that the
// request's upstream attempts follow.
message ModelRoutingPolicy {
  // Failure classes after which a request may move on to its next target. Each maps to a router
  // :ref:`retry condition <config_http_filters_router_x-envoy-retry-on>`.
  enum FallbackCondition {
    FALLBACK_CONDITION_UNSPECIFIED = 0;

    // ``connect-failure``: the connection or TLS handshake to the target failed, or timed out.
    CONNECT_FAILURE = 1;

    // ``reset``: the target reset the stream or the connection failed, including a per-try
    // timeout.
    RESET = 2;

    // ``retriable-status-codes`` with 429.
    RATE_LIMITED = 3;

    // ``5xx``: a 5xx response, a reset, a connection failure or a per-try timeout.
    SERVER_ERROR = 4;

    // ``retriable-status-codes`` with 503 and 529.
    OVERLOADED = 5;

    // ``gateway-error``: a 502, 503 or 504 response, a reset, a connection failure or a per-try
    // timeout.
    GATEWAY_ERROR = 6;
  }

  // A model served by one endpoint.
  // [#next-free-field: 6]
  message Target {
    // Name of the target in logs. Defaults to ``model``.
    string id = 1 [(validate.rules).string = {max_len: 128}];

    // DNS name, IPv4 address or bracketed IPv6 address of the endpoint, without a port. The dynamic
    // forward proxy cluster connects to it, and it becomes the request authority.
    string host = 2 [(validate.rules).string = {min_len: 1 max_len: 255}];

    // Port of the endpoint. Zero selects the cluster's default port and leaves the port out of the
    // request authority.
    uint32 port = 3 [(validate.rules).uint32 = {lte: 65535}];

    // Model name the endpoint expects in the request body's ``model`` field.
    string model = 4 [(validate.rules).string = {min_len: 1 max_len: 256}];

    // Request path for the endpoint, in which ``{model}`` is replaced with ``model``. When empty,
    // the request keeps its path after route rewrites.
    string path = 5 [(validate.rules).string = {max_len: 1024}];
  }

  // Targets in preference order. The first attempt uses the first target and each retry uses the
  // next one, so a repeated target is retried.
  repeated Target targets = 1 [(validate.rules).repeated = {min_items: 1 max_items: 16}];

  // Conditions that allow moving on to the next target. When empty, ``CONNECT_FAILURE``,
  // ``RATE_LIMITED``, ``OVERLOADED`` and ``GATEWAY_ERROR`` apply.
  repeated FallbackCondition fallback_on = 2
      [(validate.rules).repeated = {items {enum {defined_only: true not_in: 0}}}];

  // Time allowed for each attempt until response headers arrive.
  google.protobuf.Duration per_try_timeout = 3 [(validate.rules).duration = {gt {}}];

  // Opaque identifier of the decision, exposed to access logs.
  string decision_id = 4 [(validate.rules).string = {max_len: 128}];
}
